<!doctype html>
<html lang="en">
<!-- Token Radar's dashboard: a static page. app.js renders the ranked board from ../data.js
     (written beside this page by main.ts), with search, category and chain filters, a Live token
     tab, a per-protocol detail view showing the model's own inputs and the eight-step farm plan,
     and the calibration table the model computed. No network: every byte the page shows is in
     data.js, and the page recomputes each row's implied value from the snapshot figures. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar: pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<main id="board" tabindex="-1" aria-busy="true"></main>
<noscript><p class="noscript">Token Radar needs JavaScript: the board is rendered from the snapshot data beside this page.</p></noscript>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
